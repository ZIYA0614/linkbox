
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkBox - 나만의 링크 관리</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">🔗 LinkBox</a>
      <button id="addSiteButton" class="primary-button">＋ 사이트 추가</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <span class="eyebrow">MY LINK COLLECTION</span>
      <h1>유용한 사이트를 한곳에!</h1>
      <p>추천 사이트를 둘러보고, 나만의 사이트도 직접 등록해 보세요.</p>

      <div class="search-box">
        <span>🔍</span>
        <label for="searchInput">사이트 검색</label>
        <input
          type="search"
          id="searchInput"
          placeholder="사이트 이름이나 설명을 검색하세요"
        >
      </div>
    </section>

    <section id="formSection" class="form-section" hidden>
      <div class="form-heading">
        <div>
          <span class="eyebrow">MY LINK</span>
          <h2 id="formTitle">나만의 사이트 등록</h2>
        </div>
        <button type="button" id="closeFormButton" class="close-button">✕</button>
      </div>

      <form id="siteForm">
        <div class="form-group">
          <label for="siteName">사이트 이름</label>
          <input
            type="text"
            id="siteName"
            placeholder="예: Notion"
            required
            maxlength="50"
          >
        </div>

        <div class="form-group">
          <label for="siteUrl">사이트 주소</label>
          <input
            type="text"
            id="siteUrl"
            placeholder="예: www.notion.com"
            required
          >
          <small>https://를 입력하지 않아도 자동으로 추가됩니다.</small>
        </div>

        <div class="form-group">
          <label for="siteDescription">사이트 설명</label>
          <input
            type="text"
            id="siteDescription"
            placeholder="사이트에 대한 간단한 설명을 입력하세요"
            maxlength="120"
          >
        </div>

        <div class="form-group">
          <label for="siteCategory">카테고리</label>
          <select id="siteCategory" required>
            <option value="dev">개발</option>
            <option value="cloud">클라우드</option>
            <option value="learning">학습</option>
            <option value="career">취업</option>
            <option value="work">업무</option>
            <option value="life">생활</option>
            <option value="other">기타</option>
          </select>
        </div>

        <div class="form-buttons">
          <button type="button" id="cancelButton" class="secondary-button">
            취소
          </button>
          <button type="submit" class="primary-button" id="saveButton">
            저장하기
          </button>
        </div>
      </form>
    </section>

    <section class="content-section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">EXPLORE LINKS</span>
          <h2>사이트 모아보기</h2>
        </div>
        <span id="resultsCount" class="results-count"></span>
      </div>

      <div class="view-filters">
        <button class="view-button active" data-view="all">전체</button>
        <button class="view-button" data-view="favorites">⭐ 즐겨찾기</button>
        <button class="view-button" data-view="mine">📝 내 사이트</button>
      </div>

      <div class="category-filters" id="categoryFilters">
        <button class="category-button active" data-category="all">전체</button>
        <button class="category-button" data-category="dev">개발</button>
        <button class="category-button" data-category="cloud">클라우드</button>
        <button class="category-button" data-category="learning">학습</button>
        <button class="category-button" data-category="career">취업</button>
        <button class="category-button" data-category="work">업무</button>
        <button class="category-button" data-category="life">생활</button>
        <button class="category-button" data-category="other">기타</button>
      </div>

      <div id="sitesGrid" class="sites-grid"></div>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">📭</div>
        <h3>표시할 사이트가 없습니다.</h3>
        <p>검색어나 필터를 변경하거나 새로운 사이트를 등록해 보세요.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 LinkBox. 나만의 유용한 링크 모음.</p>
  </footer>
</body>
</html>
