
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkbox
  namespace: linkbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkbox
  template:
    metadata:
      labels:
        app: linkbox
    spec:
      containers:
        - name: linkbox
          image: ghcr.io/ziya0614/linkbox:798e9b0a5b8076c290de6663f4d9a071a0814148
          imagePullPolicy: Always
          ports:
            - containerPort: 80
