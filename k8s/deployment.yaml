
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkbox
  namespace: linkbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkbox
  template:
    metadata:
      labels:
        app: linkbox
    spec:
      containers:
        - name: linkbox
          image: ghcr.io/ziya0614/linkbox:b0a9aa8a0195e35348a4550348fbe21b77cc8a4c
          imagePullPolicy: Always
          ports:
            - containerPort: 80
