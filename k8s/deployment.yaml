
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkbox
  namespace: linkbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkbox
  template:
    metadata:
      labels:
        app: linkbox
    spec:
      containers:
        - name: linkbox
          image: ghcr.io/ziya0614/linkbox:36e9fbbc617e8e393b5e20fa1bed69da908f73d6
          imagePullPolicy: Always
          ports:
            - containerPort: 80
