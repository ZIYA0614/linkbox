
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkbox
  namespace: linkbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkbox
  template:
    metadata:
      labels:
        app: linkbox
    spec:
      containers:
        - name: linkbox
          image: ghcr.io/ziya0614/linkbox:6edd868ec044b00ea7f894d6aa6266d7bba2e565
          imagePullPolicy: Always
          ports:
            - containerPort: 80
