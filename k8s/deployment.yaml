
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkbox
  namespace: linkbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkbox
  template:
    metadata:
      labels:
        app: linkbox
    spec:
      containers:
        - name: linkbox
          image: ghcr.io/ziya0614/linkbox:edd55ad47d49109d92ee73fd1932cc9b8e207174
          imagePullPolicy: Always
          ports:
            - containerPort: 80
